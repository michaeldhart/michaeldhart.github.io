title: Michael D. Hart
description: Software engineer, dad, arts supporter, and local troublemaker in Belvidere, Illinois.
url: https://michaeldhart.com
lang: en

# Old Squarespace URLs (/updates/<slug>) redirect here via jekyll-redirect-from.
permalink: /blog/:slug/

author: Michael D. Hart
photo: /assets/img/michael.jpg

social:
  - name: Facebook
    icon: facebook
    url: https://www.facebook.com/michaeldhart
  - name: Bluesky
    icon: bluesky
    url: https://bsky.app/profile/michaeldhart.bsky.social
  - name: GitHub
    icon: github
    url: https://github.com/michaeldhart
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/_michaeldhart

# GoatCounter: the site code only, not the full URL. _layouts/default.html builds
# https://<code>.goatcounter.com/count from it. Cookieless and with no personal
# data, so it needs no consent banner. It only loads in the production build
# (the Pages workflow), so local previews never record a hit. What it collects is
# disclosed on /about/, which is also gated on this key.
goatcounter_code: michaeldhart

category_names:
  politics: Politics
  belvidere: Belvidere
  boone-county: Boone County
  coding: Coding
  projects: Projects

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
