<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% seo %}
    {%- if jekyll.environment == 'production' and site.goatcounter_code %}
    <script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
    {%- endif %}
  </head>
  <body>
    <main class="wrap">
      {% include header.html %}
      {{ content }}
      {% include footer.html %}
    </main>
  </body>
</html>
